[package]
name = "easymux"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
vte = { version = "0.10.0", package = "vte4", features = ["v0_78"] }

[build-dependencies]
glib-build-tools = "0.22.8"
